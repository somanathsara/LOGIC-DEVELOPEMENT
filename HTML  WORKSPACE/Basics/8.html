<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
        }
        .container div{
            width: 33%;
            padding : 10px;
        }
        #one {
            background-color: yellow;
            padding: 10px;
        }

        #two {
            background-color: pink;
            padding: 10px;
        }

        #three {
            background-color: greenyellow;
            padding: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="one">
            <h2>India</h2>
            <p>India is a country.</p>
        </div>
        <div id="two">
            <h2>Odisha</h2>
            <p>Odisha is a state.</p>
        </div>
        <div id="three">
            <h2>Jajpur</h2>
            <p>Jajpur is a district.</p>
        </div>
    </div>
</body>

</html>
