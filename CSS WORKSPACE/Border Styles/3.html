<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .pg1 {
            border-style: solid;
            border-width: medium;
        }

        .pg2 {
            border-style: solid;
            border-width: thick;
        }

        .pg3 {
            border-style: solid;
            border-width: 1px;
        }

        .pg4 {
            border-style: dotted;
            border-width: 5px;
        }

        .pg5 {
            border-style: inset;
            border-width: 2px;
        }

    </style>
</head>

<body>
    <p class="pg1">Hello world!</p>
    <p class="pg2">Hello world!</p>
    <p class="pg3">Hello world!</p>
    <p class="pg4">Hello world!</p>
    <p class="pg5">Hello world!</p>
</body>

</html>
