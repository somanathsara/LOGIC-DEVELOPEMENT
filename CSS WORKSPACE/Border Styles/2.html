    <title>Document</title>
    <style>
        .mixed1 {
            border-style: dotted groove solid;
        }

        .mixed2 {
            border-style: groove solid  dotted;

        }

        .mixed3 {
            border-style: dotted inset solid;

        }

        .mixed4 {
            border-style: inset groove outset;

        }

        .mixed5 {
            border-style: outset groove inset2;

        }
    </style>
</head>

<body>
    <p class="mixed1">border - 1</p>
    <p class="mixed2">border - 2</p>
    <p class="mixed3">border - 3</p>
    <p class="mixed4">border - 4</p>
    <p class="mixed5">border - 5</p>
</body>
